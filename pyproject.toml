[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumind-bifrost"
version = "0.1.0"
description = "Bifröst - The Spectral Rainbow Bridge: Frequency-Based Cognition framework with ResonanceAttention"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = {text = "MIT"}
authors = [
    {name = "Quantumind Ltd.", email = "engineering@quantumind.io"}
]
keywords = [
    "bifrost",
    "fbc",
    "resonance-attention",
    "phase-cognition",
    "spectral-computing",
    "neural-oscillations",
    "machine-learning",
    "audio-processing"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

dependencies = [
    # Core ML
    "torch>=2.3.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    # Signal Processing
    "PyWavelets>=1.5.0",
    "librosa>=0.9.0",
    "soundfile>=0.11.0",
    # Image/Media
    "Pillow>=9.0.0",
    # Utilities
    "pydantic>=2.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.12.0",
    "black>=21.0",
    "flake8>=3.9.0",
    "mypy>=0.900",
]
phase2 = [
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "scikit-learn>=1.3.0",
    "networkx>=3.1",
    "torch-geometric>=2.4.0",
]

[project.urls]
Homepage = "https://github.com/quantumind/bifrost"
Documentation = "https://github.com/quantumind/bifrost#readme"
Repository = "https://github.com/quantumind/bifrost.git"
Issues = "https://github.com/quantumind/bifrost/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bifrost*", "fbc*"]
exclude = ["tests*", "demos*", "benchmarks*"]

[tool.poetry]
name = "quantumind-bifrost"
version = "0.1.0"
description = "Bifröst - The Spectral Rainbow Bridge: Frequency-Based Cognition framework"
authors = ["Oluwaferanmi <admin@quantumind.com>"]
readme = "README.md"
packages = [{include = "bifrost", from = "src"}]

[project.scripts]
bifrost = "bifrost.cli:main"
fbc = "bifrost.cli:main"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=bifrost --cov-report=html --cov-report=term-missing"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
