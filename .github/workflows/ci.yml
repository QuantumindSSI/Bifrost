name: CI/CD - Bifröst Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov pytest-xdist

      - name: Verify installation
        run: |
          python -c "import bifrost; print('Bifröst imported successfully')"
          bifrost --help

      - name: Run test suite with coverage
        run: |
          pytest tests/ -v --cov=bifrost --cov-report=xml --cov-report=term-missing -x

      - name: Run demo verification
        run: |
          bifrost demo 1

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          pip install ruff black mypy

      - name: Run Ruff (linting)
        run: |
          ruff check src/bifrost/ --ignore E501
        continue-on-error: true

      - name: Run Black (format check)
        run: |
          black --check src/bifrost/ || true
        continue-on-error: true

      - name: Type check with mypy
        run: |
          mypy src/bifrost/ --ignore-missing-imports || true
        continue-on-error: true

  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install complexity checker
        run: |
          pip install radon lizard

      - name: Check cyclomatic complexity (NASA Rule 1)
        run: |
          echo "Checking cyclomatic complexity..."
          radon cc src/bifrost/ -a -nc || true

      - name: Check file sizes (C-04)
        run: |
          echo "Checking for oversized files..."
          find src/bifrost -name "*.py" -size +100k -exec ls -lh {} \;
          # Fail if any file > 500KB
          oversized=$(find src/bifrost -name "*.py" -size +500k | wc -l)
          if [ $oversized -gt 0 ]; then
            echo "WARNING: Found files > 500KB - NASA Rule 4 violation"
            exit 0  # Warning only for now
          fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Bandit security scan
        uses: PyCQA/bandit@main
        with:
          args: "-r src/bifrost/ -f json -o bandit-report.json || true"

      - name: Upload security scan results
        uses: actions/upload-artifact@v3
        with:
          name: bandit-report
          path: bandit-report.json
        continue-on-error: true
